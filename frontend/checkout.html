<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/checkout.css" />
  </head>

  <body>
    <main class="main">
      <div class="title">
        <!-- <a href="./landing.html" class="linkback">&larr; Back to Dashboard</a> -->
        <h1>PromptPay</h1>
      </div>

      <div class="container">
        
        <div class="main-content" id="items">
          <!-- <div class="container-add-btn">
            <a href="./admin-user-add.html" class="btn btn--primary">Add</a>
          </div> -->
          <div class="qrcode">
            <img src="./img/qrcode.png" alt="">
            <p>Scan this QR code to pay via PromptPay</p>
          </div>
        </div>
        <div class="sidebar">
          <div class="cart-summary">
            <h2 class="summary-title">Summary</h2>
            <div class="summary-item" style="border-top: 1px solid #ddd; padding-top: 16px;">
              <span class="">Total</span>
              <div class="summary-item" style="gap: 8px;">
                <span>THB</span>
                <span id="total-price"></span>

              </div>
            </div>
            <button id="cancel-btn" class="btn btn--outline" style="width: 100%;" onclick="window.location.href='./cart.html'">Cancel</button>
            <button id="checkout-btn" class="btn" style="width: 100%;">Checkout</button>
          </div>
        </div>
      </div>
    </main>
    <script src="./scripts/checkout.js" defer></script>
  </body>
</html>
